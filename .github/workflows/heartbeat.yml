name: Site Heartbeat

# Phase 1 of the homepage freshness programme (14 Oct 2026): is the site still
# rebuilding? Reads the live data/home_live.json and opens a "site-stale" issue
# when the last build is older than 90 minutes; closes it again when healthy.

on:
  schedule:
    - cron: "23 * * * *"     # hourly
  workflow_dispatch:

permissions:
  issues: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/heartbeat.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
