name: Fill Translations (NL/ES)

# Resumable and BOUNDED. Each run translates at most --limit pending segments
# via the keyless Google endpoint (free, no key, no card) and commits the
# updated translations.json; the next run continues where it left off.
#
# Keep the limits. The endpoint sustains roughly 4 requests/second, so an
# unbounded run against a full backlog takes hours and holds the shared
# exploresuriname-deploy lock the whole time, delaying every "Update Site" run.
#
# Note this never reaches a steady "complete" state: the site emits volatile
# segments each build (news headlines, "10h ago", "169 results", fixtures), so
# some pending work is normal. Translating those patterns instead of their
# rendered output is the open follow-up.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 5 * * *'   # 05:00 UTC daily until the cache is full

concurrency:
  # Same group as update.yml/cache_images.yml: deploy-type jobs queue up
  # instead of committing concurrently (concurrent commits made the final
  # pull --rebase fail every time the 15-min site rebuild landed mid-run).
  group: exploresuriname-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    # Hard ceiling. Without it a full backlog (~38k keyless-Google requests at
    # ~4 req/s) ran 2h40m and held the shared exploresuriname-deploy lock, which
    # delayed every 15-min "Update Site" run behind it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Tailwind CSS
        run: npx tailwindcss@3 -i input.css -o tailwind.css --minify

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate English pages (source for the segment inventory)
        env:
          AERODATABOX_KEY:   ${{ secrets.AERODATABOX_KEY }}
        run: python generate.py

      - name: Collect translatable segments
        run: python build_i18n.py

      - name: Translate pending segments (keyless Google, resumable)
        # Bounded batch: the script is resumable, so repeated short runs
        # drain the backlog without ever blocking a deploy.
        run: python translate_cache.py --limit 1500

      - name: Shield business names in listing titles/meta
        run: python protect_titles.py --limit 800

      - name: Commit updated cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add translations.json i18n_segments.json translation_segments.json || true
          git diff --staged --quiet || git commit -m "i18n: fill translations cache [$(date -u '+%Y-%m-%d %H:%M') UTC]"
          # The build steps above dirty many generated files (HTML, sitemap, ...).
          # Only the committed JSON caches matter here; discard the rest so
          # pull --rebase cannot fail on unstaged changes.
          git checkout -- .
          git clean -fd --quiet || true
          git pull --rebase origin main
          git push
