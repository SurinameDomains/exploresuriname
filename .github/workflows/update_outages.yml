name: Update Outage Data

on:
  schedule:
    # Every 2 hours (UTC; Suriname is UTC-3). EBS posts next-day notices during the day.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install beautifulsoup4 --break-system-packages

      - name: Scrape SWM water outages
        run: python scripts/scrape_swm.py

      - name: Scrape EBS power outages
        run: python scripts/scrape_ebs.py
        continue-on-error: true

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/swm_outages.json data/ebs_outages.json
          git add data/ebs_geocache.json 2>/dev/null || true
          # Remove debug HTML files if any (not for committing)
          git checkout -- data/_ebs_debug_*.html 2>/dev/null || true
          if git diff --staged --quiet; then echo "No changes."; exit 0; fi
          git commit -m "data: update outages [skip ci]"
          # the 15-min site build also pushes to main: rebase once if we lost the race
          git push || (git pull --rebase origin main && git push)
