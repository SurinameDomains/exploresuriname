<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><meta content="noindex" name="robots"/><title>Página no encontrada | Explore Suriname</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#11241b;color:#fff;min-height:calc(100vh / var(--z,1));display:flex;align-items:center;justify-content:center;text-align:center}.w{padding:2rem;max-width:34rem}h1{font-size:5rem;margin:0;color:#E76F51}h2{font-weight:600;margin:.5rem 0 1rem}p{color:rgba(255,255,255,.75);line-height:1.6}a.b{display:inline-block;margin:.4rem .35rem;padding:.7rem 1.4rem;border-radius:9999px;background:#E76F51;color:#fff;text-decoration:none;font-weight:600}a.o{background:transparent;border:1px solid rgba(255,255,255,.4)}body.mk-p{display:block;background:#F4EEE2;color:#1F2A24;text-align:left}.mk-w{max-width:40rem;margin:0 auto;padding:1.5rem 1rem 3rem}.mk-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem}.mk-top a{color:#1B4332;text-decoration:none;font-weight:700}.mk-c{background:#fff;border:1px solid #E7DFCF;border-radius:1rem;overflow:hidden}.mk-c img{width:100%;height:300px;object-fit:cover;display:block}.mk-b{padding:1.25rem}.mk-n{background:#FFF6E6;border:1px solid #E8CF9A;color:#7A5A12;border-radius:.75rem;padding:.8rem 1rem;font-size:.92rem;line-height:1.5;margin-bottom:1rem}.mk-pr{font-size:1.8rem;font-weight:800;color:#1F2A24;margin:.2rem 0}.mk-s{color:#5A625B;margin:.15rem 0}.mk-d{white-space:pre-wrap;color:#374151;line-height:1.6;margin-top:1rem}.mk-k{display:block;text-align:center;padding:.8rem;border-radius:.75rem;font-weight:700;text-decoration:none;margin-top:.5rem}.mk-wa{background:#25D366;color:#fff}.mk-ph{background:#1B4332;color:#fff}.mk-o{border:1px solid #1B4332;color:#1B4332}.mk-sf{font-size:.85rem;color:#656C63;margin-top:1rem;line-height:1.5}</style><meta content="en_US" property="og:locale:alternate"/><meta content="nl_NL" property="og:locale:alternate"/><style>nav button,nav a{white-space:nowrap}</style><link href="https://exploresuriname.com/404.html" hreflang="en" rel="alternate"/><link href="https://exploresuriname.com/nl/404.html" hreflang="nl" rel="alternate"/><link href="https://exploresuriname.com/es/404.html" hreflang="es" rel="alternate"/><link href="https://exploresuriname.com/404.html" hreflang="x-default" rel="alternate"/></head><body><div class="w"><h1>404</h1><h2>Este sendero no lleva a ninguna parte.</h2><p>Es posible que la página que buscas se haya movido o ya no exista. Prueba con la página de inicio o explora nuestro directorio.</p><a class="b" href="/">Volver a la página de inicio</a><a class="b o" href="/restaurants.html">Dónde comer</a><a class="b o" href="/hotels.html">Dónde dormir</a><a class="b o" href="/services.html">Servicios locales</a></div><script>
(function(){
  var m=location.pathname.match(/^\/(?:(nl|es)\/)?marketplace\/([a-z0-9-]{1,80})\/?(?:index\.html)?$/);
  if(!m) return;
  var slug=m[2];
  var more=document.querySelector(".w a.b.o");
  if(more){ more.href="/marketplace/"; more.textContent="Browse the Marketplace"; }
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
  var amt=function(n){return Number(n||0).toLocaleString("nl-NL",{maximumFractionDigits:0})};
  var CAT={"electronics": "Phones & electronics", "vehicles": "Vehicles & parts", "home": "Home & furniture", "fashion": "Fashion", "kids": "Baby & kids", "sports": "Sports & hobby", "tools": "Tools & garden", "property": "Property", "other": "Other"};
  fetch("https://esr-leaderboard.surinamedomains.workers.dev/market/approved?s=market",{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){
    var a=(Array.isArray(j)?j:[]).filter(function(x){return x.slug===slug})[0];
    if(!a||a.status!=="live") return;
    document.title=a.title+" | Explore Suriname";
    var prop=a.category==="property";
    var price=(!prop&&!Number(a.price))?"Free":a.currency+" "+amt(a.price)+(a.deal==="rent"?" per "+(a.period||"month"):"");
    var url=location.origin+"/marketplace/"+slug+"/";
    var k="", d=String(a.phone||"").replace(/\D/g,"");
    if(a.phone&&a.wa){
      var msg='Hi, I saw your ad "'+a.title+'" on Explore Suriname. Is it still available?\n'+url;
      k+='<a class="mk-k mk-wa" target="_blank" rel="noopener nofollow" href="https://wa.me/'+d+'?text='+encodeURIComponent(msg)+'">Message on WhatsApp</a>';
    } else if(a.phone){
      k+='<a class="mk-k mk-ph" href="tel:+'+d+'">Call '+esc(a.phone)+'</a>';
    }
    if(a.email) k+='<a class="mk-k mk-o" href="mailto:'+esc(a.email)+'?subject='+encodeURIComponent("About your ad: "+a.title)+'">Send an email</a>';
    if(a.link) k+='<a class="mk-k mk-o" target="_blank" rel="noopener nofollow" href="'+esc(a.link)+'">Open the seller&#8217;s page</a>';
    var img=(a.images&&a.images[0])||"";
    document.body.className="mk-p";
    document.body.innerHTML='<div class="mk-w">'
      +'<div class="mk-top"><a href="/">Explore Suriname</a><a href="/marketplace/">Marketplace</a></div>'
      +'<div class="mk-n" role="status"><b>Just published.</b> The full page for this ad is being built and goes live within about 15 minutes. This page switches over by itself.</div>'
      +'<div class="mk-c">'+(img?'<img src="'+esc(img)+'" alt="'+esc(a.title)+'">':'')
      +'<div class="mk-b"><p class="mk-pr">'+esc(price)+'</p>'
      +'<h1 translate="no" style="font-size:1.4rem;margin:0 0 .25rem;color:#1B4332">'+esc(a.title)+'</h1>'
      +'<p class="mk-s">'+esc(CAT[a.category]||"Other")+' &middot; '+esc(a.district)+(a.area?', '+esc(a.area):'')+'</p>'
      +(a.seller&&a.seller.name?'<p class="mk-s">Seller: <b>'+esc(a.seller.name)+'</b></p>':'')
      +(a.descr?'<p class="mk-d" translate="no">'+esc(a.descr)+'</p>':'')
      +k
      +'<p class="mk-sf"><b>Safe buying.</b> Meet somewhere busy, check it before you pay, and never send money in advance. Explore Suriname does not handle payments or vet sellers.</p>'
      +'</div></div></div>';
    var tries=0, t=setInterval(function(){
      if(++tries>53){ clearInterval(t); return; }
      fetch(location.pathname+"?cb="+Date.now(),{method:"HEAD",cache:"no-store"}).then(function(r){
        if(r.ok){ clearInterval(t); location.reload(); }
      }).catch(function(){});
    },45000);
  }).catch(function(){});
})();
</script></body></html>
